<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webex Connect Chat Test</title>
    <style>
        /* ---------- "Chat with Agent" card, bottom-left ---------- */
        #chat-launcher-card {
            position: fixed;
            left: 24px;
            bottom: 24px;
            width: 240px;
            padding: 20px 16px 16px;
            background: #f2f2f2;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            font-family: "Segoe UI", Helvetica, Arial, sans-serif;
            text-align: center;
            z-index: 99998;
        }
        #chat-launcher-card .chat-icon { width: 28px; height: 28px; color: #333; }
        #chat-launcher-card h3 { margin: 8px 0 4px; font-size: 16px; font-weight: 400; color: #222; }
        #chat-launcher-card .call-text { margin: 0 0 14px; font-size: 12px; color: #555; }
        #begin-chat-btn {
            padding: 6px 16px;
            font-size: 13px;
            background: #fff;
            border: 1px solid #999;
            border-radius: 3px;
            cursor: pointer;
        }
        #begin-chat-btn:hover { background: #e8e8e8; }
        #begin-chat-btn:disabled { cursor: wait; opacity: 0.6; }

        /* ---------- Webex widget overrides ---------- */
        /* Hide the default floating bubble and the greeting/unread pop-up next to it */
        #divicw #imi-chatbutton,
        #divicw .main-unreadchat-cont { display: none !important; }

        /* Move the chat window to the bottom-left, where the card sits (desktop only;
           on phones the widget goes full screen on its own) */
        @media (min-width: 700px) {
            #divicw #divchatmain {
                left: 24px !important;
                right: auto !important;
                bottom: 24px !important;
            }
        }
    </style>
</head>

<body>

    <h1>Chat Test Page</h1>
    <p>This is a test page for the Webex Connect chat widget.</p>

    <!-- Custom launcher card -->
    <div id="chat-launcher-card">
        <svg class="chat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M4 4h12v9H8l-4 3V4z"/>
            <path d="M16 8h4v10l-3-2.5H9V13"/>
        </svg>
        <h3>Chat with Agent</h3>
        <button id="begin-chat-btn" type="button">Begin Chat</button>
    </div>

    <!-- Webex Connect widget container -->
    <div id="divicw" data-bind="08EC0F6A-B6A6-4AEA-BA1C-6B89B32BC141" data-org="" data-guid="aacb576a-37cb-4ba3-844c-9f375f87aab1"></div>

    <script>
    (function () {
        var card = document.getElementById('chat-launcher-card');
        var btn = document.getElementById('begin-chat-btn');
        var container = document.getElementById('divicw');
        var widgetReady = false;
        var openRequested = false;

        // 1. Load the widget in the background as soon as the page loads,
        //    so the chat window opens instantly when Begin Chat is clicked.
        var s = document.createElement('script');
        s.src = 'https://chat-widget.produs1.ciscoccservice.com/js/imichatinit.js?t=' + new Date().toISOString();
        s.addEventListener('load', function () {
            console.log(new Date().toISOString(), 'Livechat script loaded successfully!');
            // Fired by the widget once its chat window is ready to open
            window.imichatwidget.on('imichat-widget:ready', function () {
                widgetReady = true;
                watchChatWindow();
                if (openRequested) openChat();
            });
        });
        s.addEventListener('error', function () {
            console.log(new Date().toISOString(), 'Error loading Livechat script');
            showUnsupportedAlert(container);
        });
        container.insertAdjacentElement('afterend', s);

        // 2. Begin Chat opens the chat window directly (no bubble)
        btn.addEventListener('click', function () {
            if (widgetReady) { openChat(); return; }
            openRequested = true;          // widget still loading: open as soon as it's ready
            btn.disabled = true;
            btn.textContent = 'Connecting...';
        });

        function openChat() {
            openRequested = false;
            btn.disabled = false;
            btn.textContent = 'Begin Chat';
            window.imichatwidget.maximizeWindow();
        }

        // 3. Swap card <-> chat window: hide the card while chat is open,
        //    bring it back when the visitor minimizes/closes the chat.
        function watchChatWindow() {
            var chatWin = document.getElementById('divchatmain');
            if (!chatWin) return;
            var sync = function () {
                card.style.display = (chatWin.style.display === 'block') ? 'none' : 'block';
            };
            new MutationObserver(sync).observe(chatWin, { attributes: true, attributeFilter: ['style'] });
            sync();
        }

        // Original "browser not supported" fallback from the Webex snippet
        function showUnsupportedAlert(e) {
            e.insertAdjacentHTML('afterend', '<iframe id="tls_al_frm" frameborder="0" style="overflow:hidden;height:208px;width:394px;position:fixed;right:48px;bottom:12px;z-index:99999;display:none;"></iframe>');
            var t = document.getElementById('tls_al_frm'), d = t.contentWindow.document;
            d.open();
            d.write("<!doctype html><html><head><meta charset='utf-8'><style>body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#99a0b0;font-size:14px}.popover__content{background-color:#fbfbfe;padding:1.5rem;border-radius:5px;width:300px;box-shadow:0 2px 5px 0 rgba(0,0,0,0.26);position:relative}.popover__message{font-weight:600;color:#56627c;font-size:16px}.close-btn{position:absolute;right:15px;top:15px}.close-btn a{text-decoration:none;color:#56627c;font-size:16px}</style></head><body><div class='popover__content'><div class='close-btn'><a href='#' onclick='closeTLSAlert()'>X</a></div><div class='popover__message'>This browser version is not supported on LiveChat.</div><p>Please update your browser to the latest version and re-open the website to access the widget.</p></div><script>function closeTLSAlert(){window.parent.postMessage({action:'close_tls_alert'},'*');}<\/script></body></html>");
            d.close();
            t.style.display = 'block';
            window.addEventListener('message', function (ev) {
                if (ev.data && ev.data.action === 'close_tls_alert') { var f = document.getElementById('tls_al_frm'); f && f.remove(); }
            });
        }
    })();
    </script>
</body>
</html>
